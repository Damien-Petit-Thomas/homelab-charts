{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "homelab-common.serviceAccountName" . }}
  labels:
    {{- include "homelab-common.labels" (dict "context" $) | nindent 4 }}
# Vaultwarden never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
