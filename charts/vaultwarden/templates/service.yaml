apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab-common.fullname" . }}
  labels:
    {{- include "homelab-common.labels" (dict "context" $ "component" "server") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "homelab-common.selectorLabels" (dict "context" $ "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
