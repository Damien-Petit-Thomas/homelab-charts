apiVersion: v2
name: vaultwarden
description: >-
  Vaultwarden, hardened: Pod Security "restricted", read-only root filesystem,
  SQLite with consistent scheduled backups, optional OpenID Connect login that
  keeps working when the identity provider is down.
type: application
version: 1.0.0
appVersion: "1.37.3"
kubeVersion: ">=1.34.0-0"
home: https://github.com/Damien-Petit-Thomas/homelab-charts
sources:
  - https://github.com/Damien-Petit-Thomas/homelab-charts/tree/main/charts/vaultwarden
  - https://github.com/dani-garcia/vaultwarden
keywords:
  - vaultwarden
  - bitwarden
  - password-manager
maintainers:
  - name: Damien Petit-Thomas
    url: https://github.com/Damien-Petit-Thomas
dependencies:
  # Vendored into the published package (charts/), so consumers never resolve
  # file://. A range rather than a pin: a library release must not break the
  # build; the packaged library is whatever this commit holds.
  - name: homelab-common
    version: ">=0.1.0 <1.0.0"
    repository: file://../homelab-common
