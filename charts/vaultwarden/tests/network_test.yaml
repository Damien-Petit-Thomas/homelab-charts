suite: service, ingress and network policies
templates:
  - templates/service.yaml
  - templates/ingress.yaml
  - templates/networkpolicy.yaml
  - templates/tests/test-alive.yaml
release:
  name: vw
  namespace: vaultwarden
values:
  - values/base.yaml
tests:
  - it: selects only the server pods
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: vw
            app.kubernetes.io/name: vaultwarden

  - it: creates no Ingress by default
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the host to the service, with TLS
    template: templates/ingress.yaml
    values:
      - values/full.yaml
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik
      - equal:
          path: spec.tls
          value:
            - hosts: [vaultwarden.example.org]
              secretName: vaultwarden-tls
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: vw-vaultwarden
            port:
              name: http

  - it: requires a host when the Ingress is enabled
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'ingress.host is required when ingress.enabled is true'

  - it: admits the ingress controller and the test pod only
    template: templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
            - podSelector:
                matchLabels:
                  vaultwarden-client: vw-vaultwarden

  - it: allows DNS egress only by default
    template: templates/networkpolicy.yaml
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 1
      - equal:
          path: spec.egress[0].ports
          value:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP

  - it: appends extra egress rules and isolates the backup job
    template: templates/networkpolicy.yaml
    values:
      - values/full.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: 192.0.2.10/32
        documentIndex: 0
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: backup
        documentIndex: 1
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
        documentIndex: 1
      - notExists:
          path: spec.ingress
        documentIndex: 1
      - notExists:
          path: spec.egress
        documentIndex: 1

  - it: renders no policy when disabled
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: gives the test pod the label the policy admits
    template: templates/tests/test-alive.yaml
    asserts:
      - equal:
          path: metadata.labels.vaultwarden-client
          value: vw-vaultwarden
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.containers[0].command[-1]
          value: http://vw-vaultwarden:8080/alive
