suite: storage and backup
templates:
  - templates/pvc.yaml
  - templates/backup.yaml
release:
  name: vw
  namespace: vaultwarden
values:
  - values/base.yaml
tests:
  - it: creates a data claim protected from Helm and ArgoCD deletion
    template: templates/pvc.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: vw-vaultwarden-data
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]

  - it: leaves the claim unprotected only on request
    template: templates/pvc.yaml
    set:
      persistence.retain: false
    asserts:
      - notExists:
          path: metadata.annotations

  - it: creates no claim for an existing one
    template: templates/pvc.yaml
    set:
      persistence.existingClaim: vaultwarden-config-pvc
    asserts:
      - hasDocuments:
          count: 0

  - it: creates no backup resources by default
    template: templates/backup.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: never creates a backup claim
    template: templates/pvc.yaml
    set:
      backup.enabled: true
      backup.existingClaim: nfs-backups
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: vw-vaultwarden-data

  - it: requires a backup claim when backups are enabled
    template: templates/backup.yaml
    set:
      backup.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'backup.existingClaim is required when backup.enabled is true'

  - it: ships the backup and restore scripts
    template: templates/backup.yaml
    set:
      backup.enabled: true
      backup.existingClaim: nfs-backups
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["backup.sh"]
          pattern: 'VACUUM INTO'
      - matchRegex:
          path: data["restore.sh"]
          pattern: 'pre-restore'

  - it: never runs two backups at once and gives up stuck ones
    template: templates/backup.yaml
    set:
      backup.enabled: true
      backup.existingClaim: nfs-backups
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.timeZone
          value: Etc/UTC
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 900

  - it: runs the backup with the server image, uid and restrictions
    template: templates/backup.yaml
    set:
      backup.enabled: true
      backup.existingClaim: nfs-backups
      backup.retention: 7
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: docker.io/vaultwarden/server:1.37.3@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: RETENTION, value: "7"}
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]
          value: backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: vw-vaultwarden-data
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: backup
            persistentVolumeClaim:
              claimName: nfs-backups
