# Releases (ADR 0003). On every push to main, release-please maintains one
# release pull request per chart. Merging one tags <chart>-vX.Y.Z and creates
# the GitHub release; the publish job then pushes the chart to GHCR as an OCI
# artifact, signs it (cosign keyless) and attests its build provenance.
name: release

on:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# Never two release runs at once: they would race on the release PRs and tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the GitHub App's credentials; deploys from main only.
    environment: release
    permissions: {}
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # A pull request opened with GITHUB_TOKEN triggers no workflow: the
      # release PR would never get its required checks. A GitHub App token,
      # scoped to this repository and these two permissions, does.
      - name: GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homelab-charts
          permission-contents: write
          permission-pull-requests: write

      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]' && needs.release-please.outputs.paths_released != ''
    name: publish (${{ matrix.path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # keyless signing and provenance (OIDC)
      attestations: write   # provenance attestation
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    env:
      CHART_PATH: ${{ matrix.path }}
      REGISTRY: ghcr.io/damien-petit-thomas/charts
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          sha256: 2b289d1b3074e0b1d3f95bad0bd78bbc517c1a5bcb020cbc1643d260f5d1a351
          # A publishing job never restores a cache another run could have written.
          cache: false

      - name: Package
        id: package
        run: |
          name="$(yq -r '.name' "$CHART_PATH/Chart.yaml")"
          version="$(yq -r '.version' "$CHART_PATH/Chart.yaml")"
          helm dependency build --skip-refresh "$CHART_PATH"
          helm package "$CHART_PATH" --destination "$RUNNER_TEMP/dist"
          {
            echo "name=$name"
            echo "version=$version"
            echo "tgz=$RUNNER_TEMP/dist/$name-$version.tgz"
          } >> "$GITHUB_OUTPUT"

      - name: Push to GHCR
        id: push
        env:
          TOKEN: ${{ github.token }}
          TGZ: ${{ steps.package.outputs.tgz }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          out="$(helm push "$TGZ" "oci://$REGISTRY" 2>&1)"
          echo "$out"
          digest="$(sed -nE 's/^Digest: (sha256:[0-9a-f]{64})$/\1/p' <<<"$out")"
          [[ -n "$digest" ]] || { echo "::error::no digest in the helm push output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign (cosign keyless)
        env:
          TOKEN: ${{ github.token }}
          REF: ${{ env.REGISTRY }}/${{ steps.package.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          printf '%s' "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$REF"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.package.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # What a consumer runs: the job fails if the published artifact cannot
      # be verified the documented way.
      - name: Verify signature and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ env.REGISTRY }}/${{ steps.package.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "signature verified for $REF"
          gh attestation verify "oci://$REF" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
