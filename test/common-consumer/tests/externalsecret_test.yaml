suite: ExternalSecrets
templates:
  - templates/externalsecrets.yaml
release:
  name: rel
  namespace: apps
tests:
  - it: renders nothing without entries
    asserts:
      - hasDocuments:
          count: 0

  - it: applies the defaults
    set:
      externalSecrets:
        oidc:
          secretStoreRef:
            name: vault-backend
          data:
            - secretKey: CLIENT_SECRET
              remoteRef:
                key: homelab/app-oidc
                property: client-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: rel-common-consumer-oidc
      - equal:
          path: metadata.namespace
          value: apps
      - equal:
          path: spec
          value:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: rel-common-consumer-oidc
              creationPolicy: Owner
              deletionPolicy: Retain
            data:
              - secretKey: CLIENT_SECRET
                remoteRef:
                  key: homelab/app-oidc
                  property: client-secret

  - it: passes overrides, template and dataFrom through
    set:
      externalSecrets:
        db:
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
          refreshInterval: 15m
          secretStoreRef:
            name: vault-app
            kind: SecretStore
          target:
            name: app-db
            creationPolicy: Merge
            template:
              type: kubernetes.io/basic-auth
          dataFrom:
            - extract:
                key: homelab/app-db
    asserts:
      - equal:
          path: metadata.name
          value: app-db
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "-1"
      - equal:
          path: spec.target
          value:
            name: app-db
            creationPolicy: Merge
            deletionPolicy: Retain
            template:
              type: kubernetes.io/basic-auth
      - equal:
          path: spec.dataFrom[0].extract.key
          value: homelab/app-db
      - notExists:
          path: spec.data

  - it: renders entries in key order and skips disabled ones
    set:
      externalSecrets:
        zeta:
          secretStoreRef: {name: vault-backend}
          dataFrom: [{extract: {key: homelab/zeta}}]
        alpha:
          secretStoreRef: {name: vault-backend}
          dataFrom: [{extract: {key: homelab/alpha}}]
        off:
          enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: rel-common-consumer-alpha
        documentIndex: 0
      - equal:
          path: metadata.name
          value: rel-common-consumer-zeta
        documentIndex: 1

  - it: requires the secret store name
    set:
      externalSecrets:
        oidc:
          dataFrom: [{extract: {key: homelab/x}}]
    asserts:
      - failedTemplate:
          errorPattern: 'externalSecrets.oidc.secretStoreRef.name is required'

  - it: rejects an unknown store kind
    set:
      externalSecrets:
        oidc:
          secretStoreRef: {name: vault-backend, kind: Vault}
          dataFrom: [{extract: {key: homelab/x}}]
    asserts:
      - failedTemplate:
          errorPattern: 'externalSecrets.oidc.secretStoreRef.kind must be SecretStore or ClusterSecretStore, got "Vault"'

  - it: requires data or dataFrom
    set:
      externalSecrets:
        oidc:
          secretStoreRef: {name: vault-backend}
    asserts:
      - failedTemplate:
          errorPattern: 'externalSecrets.oidc needs data or dataFrom'

  - it: requires secretKey on every data item
    set:
      externalSecrets:
        oidc:
          secretStoreRef: {name: vault-backend}
          data:
            - remoteRef: {key: homelab/x}
    asserts:
      - failedTemplate:
          errorPattern: 'externalSecrets.oidc.data\[0\].secretKey is required'

  - it: requires remoteRef.key on every data item
    set:
      externalSecrets:
        oidc:
          secretStoreRef: {name: vault-backend}
          data:
            - secretKey: A
              remoteRef: {key: homelab/x}
            - secretKey: B
              remoteRef: {property: p}
    asserts:
      - failedTemplate:
          errorPattern: 'externalSecrets.oidc.data\[1\].remoteRef.key is required'

  - it: rejects a key that cannot be part of a resource name
    set:
      externalSecrets:
        Bad_Key:
          secretStoreRef: {name: vault-backend}
          dataFrom: [{extract: {key: homelab/x}}]
    asserts:
      - failedTemplate:
          errorPattern: 'externalSecrets.Bad_Key: the key must be a DNS-1123 label'
